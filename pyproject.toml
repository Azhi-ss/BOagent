[project]
name = "boagent-workspace"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "bo-core",
    "api"
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
bo-core = { workspace = true }
api = { workspace = true }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.workspace]
members = ["packages/bo-core", "apps/api"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "pandera>=0.20.0",
    "hypothesis>=6.100.0",
    "evidently>=0.4.0",
    "matplotlib>=3.8.0"
]
