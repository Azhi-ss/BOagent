[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bo-core"
version = "0.1.0"
description = "BOagent core: LLM-driven Bayesian optimization for perovskite solar cells."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "pandas",
    "requests",
    "openpyxl",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["bo_core*"]
exclude = ["tests*"]
