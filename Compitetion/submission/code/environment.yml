name: lgbo_env
channels:
  - pytorch
  - nvidia
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
    - torch==2.4.1+cu121
    - torchvision==0.19.1+cu121
    - torchaudio==2.4.1+cu121
    - gpytorch>=1.15.0
    - botorch>=0.18.0,<0.19.0
    - numpy>=1.24.0
    - pandas>=2.0.0
    - scipy>=1.10.0
    - scikit-learn>=1.3.0
    - pandera>=0.20.0
    - requests>=2.30.0
    - pyyaml>=6.0
    - --extra-index-url https://download.pytorch.org/whl/cu121
